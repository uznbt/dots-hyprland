$lock_cmd = hyprctl dispatch 'hl.dsp.global("quickshell:lock")' & pidof qs quickshell hyprlock || hyprlock
# $lock_cmd = pidof hyprlock || hyprlock
$suspend_cmd = systemctl suspend || loginctl suspend
$fingerprint_off = qs -c ii ipc call lock pauseFingerprint
$fingerprint_on = qs -c ii ipc call lock resumeFingerprint

general {
    lock_cmd = $lock_cmd
    before_sleep_cmd = loginctl lock-session; $fingerprint_off
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.global("quickshell:lockFocus")'; $fingerprint_on
    inhibit_sleep = 3
}

listener {
    timeout = 300 # 5mins
    on-timeout = loginctl lock-session
}

listener {
    timeout = 600 # 10mins
    on-timeout = $fingerprint_off; hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'; $fingerprint_on
}

listener {
    timeout = 900 # 15mins
    on-timeout = $suspend_cmd
}
